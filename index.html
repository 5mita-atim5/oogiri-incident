<style>
:root{
  /* ===== 見た目の調整はここ ===== */
  --switch-gap: calc(1.85em * 0.5);   /* セリフと地の文が切り替わるときの間（今は0.5行） */
  --scene-gap: 1.4em;    /* 場面の区切り（空行）の間 */
  --name-width: 2.6em;   /* 名前の列の幅 */
  --font-size: 17px;     /* 文字の大きさ */
  --rel-name-width: 6.5em; /* 主な関係者の名前の列の幅 */
  /* ============================ */
  --bg:#f7f4ee; --paper:#fffdf9; --text:#2b2723; --sub:#7a7168; --line:#ddd5c9;
  --accent:#9b2c2c; --btn:#fffdf9; --btn-hover:#f1ebe1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1917; --paper:#232120; --text:#ebe5dc; --sub:#a39a8f; --line:#3d3934;
    --accent:#e07a6e; --btn:#2a2725; --btn-hover:#34302d;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1917; --paper:#232120; --text:#ebe5dc; --sub:#a39a8f; --line:#3d3934;
  --accent:#e07a6e; --btn:#2a2725; --btn-hover:#34302d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif JP",serif;font-size:var(--font-size);line-height:1.85;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:28px 16px 64px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px 20px}
h1{font-size:2em;font-weight:600;text-align:center;margin:.6em 0 .2em;letter-spacing:.1em}
h2{font-size:1em;font-weight:600;color:var(--sub);margin:0 0 1em;padding-bottom:.5em;border-bottom:1px solid var(--line)}
h3{font-size:.95em;font-weight:600;margin:1.4em 0 .4em}
p{margin:0}
.ln{display:grid;grid-template-columns:var(--name-width) minmax(0,1fr)}
.sp{padding-left:1em;text-indent:-1em}
.ctr{text-align:center}
.rel{display:grid;grid-template-columns:var(--rel-name-width) minmax(0,1fr)}
.new{display:inline-block;font-size:.72em;line-height:1;padding:3px 6px;margin-left:8px;border-radius:4px;background:var(--accent);color:var(--paper);vertical-align:2px;font-family:sans-serif;letter-spacing:.05em}
.brk{margin-top:var(--scene-gap)}
.sw{margin-top:var(--switch-gap)}
rt{font-size:.5em}
.note{font-size:.85em;color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:1.6em}
button{font:inherit;font-size:.95em;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;line-height:1.5}
button:hover{background:var(--btn-hover)}
button.read{color:var(--sub)}
button.read::after{content:"　済";font-size:.8em}
button.main{text-align:center;border-color:var(--accent);color:var(--accent)}
button.mid{text-align:center}
.slist{align-items:center}
.slist button{width:15em;max-width:100%;padding-left:1.6em}
.fin{text-align:center;margin-top:2.4em}
.fin a{color:var(--accent);word-break:break-all}
.fin .fin-word{font-size:1.6em;letter-spacing:.2em;margin-bottom:.4em}
.group{display:flex;flex-direction:column;gap:6px}
.person{font-size:.9em;color:var(--sub);margin:1em 0 .2em}
.title-k{text-align:center;font-size:1.2em;letter-spacing:.1em;margin:0 0 1.2em}
.title-sub{text-align:center;color:var(--sub);margin-bottom:2em}
.warn{font-size:.85em;color:var(--sub);border-top:1px solid var(--line);margin-top:2em;padding-top:1em}
.warn p{padding-left:1em;text-indent:-1em}
</style>
</head>

<main id="app"></main>
<script>
const BLOCKS = {
OP:{t:"", x:`楽屋の方から悲鳴が聞こえた。
私が{岩塚|いわつか}さんと楽屋に駆けつけると、椅子に座った{亀田|かめだ}さんが長机に突っ伏していた。
{越後|えちご}「社長、起きてくださいって、肩をたたいたら…」
亀田さんは、もう息をしていなかった。
楽しい大喜利大会がこんなことになるなんて…

>>＊

吹雪のため警察の到着には時間がかかるという。
犯行はイベントの休憩時間中で間違いないだろう。
困ったことに私はアリバイが証明できない。

このままでは、私が犯人にされる。
疑いを晴らすには自分で真犯人を見つけるしかない。`},

M1:{t:"思い出す：大喜利大会と関係者", x:`今日のことを、最初から思い出す。
今日は、長岡の公民館で開かれる町の大喜利大会だった。
出場者はほとんどが地元の人で私は初出場だ。
昨日から大雪だったが大会は予定通り開かれた。

【主な関係者】
@@{亀田|かめだ} {剛|つよし}::大喜利審査委員長。市内の建設会社の社長で大会のスポンサー。やり手とのことだが悪い噂も聞く。
@@{岩塚|いわつか} カナ::大喜利司会者。東京から来たTVタレント。
@@{越後|えちご} {美咲|みさき}::大喜利回答者。亀田さんの会社の社員で芸人志望。
@@{三幸|さんこう} {和夫|かずお}::大喜利回答者。亀田さんの会社の下請けの社長。現場上がりで体格がいい。
@@私::大喜利回答者。生大喜利は今日が初めて。

大喜利大会は亀田さんの挨拶から始まった。
亀田「この大会も、この公民館も、うちの会社、いや、俺がつくりました。」
亀田さんは同じことを二度繰り返した。
客席の後ろで、公民館の職員が複雑な表情を浮かべていた。
会場で亀田さんに意見できる人は、多分いない。`},

M2:{t:"思い出す：朝の楽屋", x:`今朝のことを思い出す。
楽屋は、出演者共用の小さな会議室だった。
長机と椅子が数脚。
窓の外には、太いつららが何本も下がっていた。

楽屋でタレントの岩塚さんに会った。
今日の司会だそうだ。
膝上のスカートの下には真っ赤なタイツ、デビューからのトレードマークらしい。
岩塚「この格好じゃないと舞台に立てないの」
岩塚さんは笑って言った。
そこへ、亀田さんが勢いよくドアを開けた。
後ろについてきた公民館の職員に急かすように言う。
亀田「おい、コーヒー早くしろ！」
慌てた職員はコーヒーを置き損ね、岩塚さんの赤いタイツにコーヒーの黒い点を散らかした。
岩塚「大変！着替えないと！みんな外に出て！」
私たちはすぐに楽屋代わりの会議室を出た。
会議室の前の廊下の窓にも、一際大きなつららが下がっていた。`},

M3:{t:"思い出す：大喜利前半戦の舞台", x:`大喜利の前半戦のことを思い出す。
大会はスムーズに進んでいくが、初めての舞台で私は精一杯だった。

岩塚「行きます！お題、デキスギくんの意外な悩み！」
私は緊張しながら手を挙げる。
私「敗北を知りたい」
岩塚「普通に嫌なヤツー！」

岩塚さんはツッコミを入れて軽快に場を回す。
しかし、審査委員長の亀田さんが口を挟む。
亀田「なんだ、その回答？司会はもっとテンポ良く！」
亀田さんは上着を脱ぎ、額の汗をハンカチでぬぐっている。
亀田さんは三幸さんの回答にも口を挟む。
亀田「三幸、そんなんじゃ次はないぞ。大会も取引もな」

会場の空気が淀みかけた中、越後さんが手を挙げる。
岩塚「越後さん、お願いします！デキスギくんの意外な悩み！」
越後「母親が『息子の出番の少なさ』を悩んでいること」
岩塚「映画にも出したげてー！」
亀田さんがマイクを取った。
亀田「長い、コンパクトに」
会場に微妙な空気が漂う。

越後さんはうつむいた。
三幸さんは愛想笑いを浮かべていた。
岩塚さんは笑顔のまま場を回していた。`},

M4:{t:"思い出す：休憩に入る前", x:`前半戦の終わりを思い出す。
岩塚「マイクの調子が悪いみたいなので、少し長めに30分の休憩に入ります」
運営スタッフが忙しなく動き回る。
亀田さんが立ち上がって言った。
亀田「楽屋で前半戦の評価をする。後半戦の前に呼びにこい」
亀田さんが会場を出ていくと岩塚さんも続いた。
岩塚「亀田さんに後半の確認してきます」`},

M5:{t:"思い出す：休憩中", x:`休憩中のことを思い出す。

舞台ではスタッフがマイクの調整をしている。
狭い楽屋よりはと私は楽屋へ続く廊下の角で一人壁にもたれていた。
亀田さんと、そのあとに続く岩塚さんが、私の前を通って楽屋の方へ曲がっていった。
ここから楽屋のドアは見えない。

何気なくスマホを見ている間、何度か楽屋のドアを開け閉めする音と、換気のためか窓を開ける音、風が吹き込む音が聞こえた。
しばらくして、岩塚さんが楽屋の方から戻ってきて声をかけてくれた。
岩塚「大喜利初なんだって？さっきの回答、面白かった！」
続けてお客さんが三人しかいなかったときの舞台の話をしてくれた。
ただ岩塚さんは私に話しているのに、どこか上の空のように見えた。
話している間に、三幸さんが楽屋の方へ歩いていった。
しばらくして、今度は越後さんも通っていった。
手には、キャラクターのキーホルダーをジャラジャラつけたスマホを握っていた。

その後、岩塚さんと私はずっと話していた。`},

G1:{t:"現場を見る：被害者と室内", x:`楽屋の中は、外と変わらないほど冷えていた。
外は吹雪なのに窓が開いていて雪と冷たい風が吹き込んでいる。
亀田さんは、ドアに背を向けた椅子に座り、長机に突っ伏している。
後頭部は血がにじんでいるように見える。
何かで殴られたのだろうか。
楽屋のドアから見たら、死んでいても寝ているように見えるかもしれない。

亀田さんは立派な体格をしている。
屈強な男でも、亀田さんの命を奪うことは簡単ではないだろう。
そもそも、楽屋の外にいた私は悲鳴はもちろん、争う音も聞こえなかった。
机の上には重そうなガラスの灰皿と評価用紙。
灰皿はタバコの灰などなく、きれいな状態だった。`},

G2:{t:"現場を見る：楽屋の窓の外", x:`窓から外をのぞく。
今朝見たつららが、軒に並んでいる。
窓のすぐ下の雪に、何かが落ちたようなあとがある。
折れたつららだろうか。
見渡した限り、雪ばかりで足跡のようなものはない。`},

G3:{t:"現場を見る：廊下の窓", x:`楽屋を出てすぐの廊下にも窓がある。
今朝見た一際大きなつららがなくなっているようだ。
随分と大きかったから折れて落ちてしまったのだろうか。
窓の下の雪は吹雪で荒れていて、何かが落ちたのかどうかもわからない。
見渡した限り、雪ばかりで足跡のようなものはない。

窓枠にタバコの灰らしきものが残っていた。`},

G4:{t:"現場を見る：楽屋の床", x:`窓の下の床には、水たまりができていた。
その上に、雪がうっすら積もっている。
これは、雪が溶けた水たまりだろうか…？`},

G5:{t:"現場を見る：評価用紙", x:`亀田さんの腕の下から、評価用紙がはみ出していた。
前半戦の各回答者についてコメントが書かれている。
余白に、走り書きが一行。

>>「トリ、KOSHIJI」

トリ…？　KOSHIJI…？
亀田さんは、最後に何かを伝えようとしたのだろうか…？`},

I1:{t:"話を聞く：岩塚 ― 休憩中のこと", x:`私「休憩に入ってすぐ、楽屋に行ったのは何のためだったんですか」
岩塚「前半、ちょっと空気が悪くなったでしょ。口を挟むのは控えてくださいって、言いに行ったの。そしたら亀田さん、大喜利のお題が悪いからだ、後半はこれでいけって。結局、使わなかったけど」
岩塚さんは上着のポケットから、一枚のカードを出して手渡してくれた。

>>〔この小学生、セレブかも？〕

受け取ったカードは、端が少ししっとりしていて、茶色い染みがにじんでいた。
岩塚「そのあとは、ずっとあなたと話してたでしょ」`},

I2:{t:"話を聞く：岩塚 ― 亀田のこと", x:`私「亀田さんとは、前から面識が？」
岩塚「昔、仕事でね」
私「今日の司会の仕事は、亀田さんから直接？」
岩塚「事務所からの紹介。来てみたら、亀田さんがいてびっくり。相変わらずだった。東京の仕事も減っちゃってね。これが最後の仕事になるかもって事務所にも言われてたんだけどね…」
岩塚さんは自嘲気味に言った。`},

I3:{t:"話を聞く：岩塚 ― 赤いタイツのこと", x:`私「朝のコーヒー、やけどしませんでした？」
岩塚「平気平気、ちょっとだけだったし」
私「替えのタイツ、持ってたんですね」
岩塚「そりゃ大事な赤いタイツだもん、替えは持ち歩いてるわ」`},

I4:{t:"話を聞く：岩塚 ― KOSHIJIのこと", x:`私「KOSHIJIのこと、聞かせてもらえますか」
岩塚「KOSHIJI…？」
岩塚さんは、少しの間黙った。
岩塚「もう私のじゃないから…」
それ以上は、何も言わなかった。`},

I5:{t:"話を聞く：岩塚 ― 今朝のこと", x:`私「今朝、亀田さんと何か話しましたか？」
岩塚「楽屋で挨拶しただけよ。今日はよろしくって」
岩塚さんは、それ以上話したくなさそうだった。`},

Y1:{t:"話を聞く：越後 ― 休憩中のこと", x:`私「休憩中、何をしていましたか？」
越後「休憩中に楽屋にスマホを取りに行きました。でも亀田社長が机で寝ていたみたいだから中に入らず、ドアを閉めました」
私「スマホはそのままにしたんですか？」
越後「社長、昨日も遅くまで準備してたみたいだし、今朝も会場に一番乗りだったみたいで…。寝てるから、起こしちゃいけない…、怒られたくないって…」

越後さんは、膝の上で手を握りしめた。
越後「後半戦が始まるからと呼びに行ったときも、まったく同じ格好で…」`},

Y2:{t:"話を聞く：越後 ― 亀田のこと", x:`私「越後さんは、どうして大会に参加されたんですか？」
越後「私、芸人さんに憧れてて、お笑いイベントに参加してるんです」
私「じゃあ、さっき亀田さんに言われたのは堪えましたね」
越後「社長はいつも、俺ならこう返す、って。良かれと思ってでしょうけど」
私「亀田さん、お笑いに詳しかったんですか？」
越後さんは、少しためらってから答えた。
越後「…社長、昔はKOSHIJIって漫才コンビを組んでいたんです」`},

Y6:{t:"話を聞く：越後 ― KOSHIJIのこと", x:`私「KOSHIJIのこと、聞かせてもらえますか」
越後「社長と岩塚さんの漫才コンビです」
私「亀田さんと岩塚さん、コンビだったんですか？！」
越後「人気だったんですけど、4年くらい前に解散しちゃいました。自然消滅みたいなことも聞きましたけど…」`},

Y3:{t:"話を聞く：越後 ― スマホのこと", x:`私「越後さん、楽屋へ行くとき、もうスマホを持ってましたよね」
越後さんは、はっとして目を伏せた。
越後「…スマホは嘘です。社長に、会社を辞めて東京に行くって言うつもりでした。でも、寝ていたので、このタイミングじゃないかと思って…。いつもそうやって、切り出せないんですけど」`},

Y4:{t:"話を聞く：越後 ― 今朝のこと", x:`私「今朝、亀田さんと何か話しましたか？」
越後「楽屋では話してません」
越後さんは、少し迷ってから小声で続けた。
越後「…実は、社長と舞台でKOSHIJIのネタを合わせてたんです。お笑いやってるなら、ツッコミ役を頼むって。最後にサプライズがあるから内緒だぞって。岩塚さんにも楽屋の前で挨拶したんですけど、緊張して『社長にネタ見てもらってます』くらいしか言えなくて…」`},

Y5:{t:"話を聞く：越後 ― 預かったカードのこと", x:`私「岩塚さんからこのカードを預かったのですが、亀田さんが書いたものですか？」
カードをのぞき込んだ越後さんが言った。
越後「これ、社長の字ですね」
越後さんはカードを読んで続けた。
越後「…これ、KOSHIJIのネタじゃないですか？」`},

S1:{t:"話を聞く：三幸 ― 休憩中のこと", x:`三幸さんは会場の隅で腕を組んでいた。
胸ポケットからタバコの箱がのぞいている。

休憩中のことを聞くと素直にうなずいた。

三幸「休憩に入って10分くらいかな、タバコを吸いに外に行こうとしたついでに一度覗いたよ。机で突っ伏して寝てた。起こしたら面倒だと思って楽屋には入らずドアを閉めた。」
私「窓は開いていましたか？」
三幸「窓は隙間程度に開いてた。亀田、あれだけ汗かいてたんだ。暑かったんだろ？」
私「三幸さん、体格が立派ですけどトレーニングでも…？」
三幸「疑ってんだろ？あの大柄な亀田をなんて、女じゃ無理だろうしな。俺のガタイなら出来んこともないよな」`},

S2:{t:"話を聞く：三幸 ― 今朝のこと", x:`三幸「大会が始まる前、トイレに行くために楽屋の前を通ったんだ。そのとき、楽屋から亀田の声が聞こえた。『相変わらず、俺がいないと何もできないんだな。…しょうがない、また面倒見てやるよ』ってな」
私「相手は誰だったんですか？」
三幸「中は見えなかった。女の短い返事が聞こえただけだ」
三幸さんは首をかしげた。
三幸「ただ、亀田は妙に上機嫌な声だったな。普段は機嫌が悪いくせにな」`},

S3:{t:"話を聞く：三幸 ― KOSHIJIのこと", x:`私「KOSHIJIについて何か知ってますか」
三幸「こしじ…？{越路|こしじ}のことかい？地名だろ、長岡の」
三幸さんは、それ以上興味もなさそうだった。`},

S4:{t:"話を聞く：三幸 ― タバコの灰のこと", x:`私「廊下の窓枠に、タバコの灰が残っていました。」
三幸さんは、しばらく黙ってから頭をかいた。
三幸「…外にタバコってのは嘘だ。本当は取引のことで亀田に用があったんだ。」
私「亀田さんと話せましたか？」
三幸「寝てた。起こして機嫌を損ねてもって思ってな、中に入らず、廊下の窓を開けて一服した。」
私「どうして黙ってたんですか？」
三幸「館内は禁煙だし、そもそも聞かれなかったしな。」`},

S5:{t:"話を聞く：三幸 ― 亀田のこと", x:`三幸さんは、亀田さんの名前を出すと苦笑いした。
三幸「怪しむのも分かるよ、下請けいじめが日常だったしな。」

T1:{t:"", x:`私「岩塚さん、さっき預かったこのカードのことですが」
岩塚「亀田さんにもらったお題でしょ」
私「越後さんは、これはKOSHIJIのネタじゃないかと言っていました」
岩塚「ネタとお題が一緒だっただけでしょ。あの人、昔の栄光にこだわっていたんじゃない？」
私「朝、コーヒーで汚れたタイツは、どこにやったんですか？」
岩塚「…着替えたときに捨てたわよ」

私はカードの端の茶色い染みを指さした。
私「さっき預かったとき、このカード、しっとりしていました。タイツに飛んだコーヒーがうつったくらいで、紙はあんなに湿りません。カードは、濡れたタイツと同じポケットに入っていたんじゃないですか」
岩塚「カードをタイツと同じポケットに入れて何か悪いの？」
私「廊下の窓の大きなつららが、なくなっていました。砕けたつららをタイツに詰めて、端を持って振り下ろせば、遠心力で女性の力でも亀田さんを倒せます。犯行に使ったつららは、窓から雪の中に捨てれば見つかりません」

岩塚さんは笑おうとして、やめた。
黙って上着のポケットから、コーヒーの染みが散った赤いタイツを出した。
冷たく湿っていた。

岩塚「…休憩に入ってすぐ、口を挟まないでって言いに行ったの。そしたら『お前こそ黙って見てろ。トリはKOSHIJIだ。ネタはこれだ』って」

岩塚さんは、拳が白くなるほど強く握りしめた。

岩塚「朝、舞台から私たちのネタが聞こえたの。ツッコミは、知らない女の声だった。楽屋の前で越後さんに会ったら、社長にネタ見てもらってますって。…ああ、KOSHIJIはもう私のじゃないんだって思った」

岩塚さんは息を吐き出して言った。
岩塚「楽屋にいられなくて、廊下の窓を開けたの。そしたら、風で大きなつららが折れて、廊下に砕けて散らばった。片付けなきゃって拾ってるうちに、ポケットのこのタイツに詰めてた。…気がついたら、楽屋に戻ってた。カードはお題ってことにした。あの人とは、仕事の話をしただけってことにしたくて」

岩塚さんは、カードの文字をじっと見つめた。
岩塚「…捨てられなかったんだよね、これ」`},

T2:{t:"", x:`越後さんが、震える声で言った。

越後「最後に岩塚さんを舞台に呼んで、昔一番ウケたネタをやるって。サプライズだから、本人には絶対言うなって。社長、ブランクがあるからって、朝ギリギリまで稽古してたんです。私はツッコミのセリフを読み上げていただけで…」

評価用紙の「トリ、KOSHIJI」は、最後の伝言ではなかった。段取りのメモだったのだ。

SH1:{t:"真相1　結成と解散", x:`ある年の春。
田舎の大学で二人は出会った。

お笑いが好きだった岩塚は落語研究会の部室の扉を叩いた。
窓際の椅子に学生には見えない男が座っていた。
大学を卒業して家業を継いだOBの亀田だった。

亀田「新入生か。漫才は好きか？」

そう言って、亀田は手書きの台本を手渡した。
岩塚は台本を受け取るとページをめくる。
最初は何の話かわからなかった。
けれど最後の一行で、それまでの全部がつながった。
岩塚は思わず声を上げて笑った。

亀田のネタはオチまでの待ちが長すぎると言われていた。
岩塚のツッコミは鋭すぎてボケが耐えられないと言われていた。
誰と組んでも、うまくいかなかった二人だった。
けれど二人で舞台に立つと、岩塚の速いツッコミが待ちの重さを消し、亀田の伏線が岩塚の鋭さを笑いに変えた。

コンビ名は二人の初舞台の場所の名前からKOSHIJI。

初舞台のお客さんは三人だけだった。
それでも二人は笑っていた。
ここから始まるんだと信じていた。

トントン拍子とはこのことだった。
人気は学内では収まらず、KOSHIJIは学生お笑いの大会を勝ち上がり、とうとうチャンピオンに輝いた。

亀田剛25歳、岩塚カナ20歳の春。
二人は東京進出を決めた。

亀田は父と、父の会社を捨てた。
岩塚は両親の反対を振り切って大学をやめた。
二人を乗せた新幹線が雪の残る長岡を離れていった。

東京での二人の舞台は順調に大きくなっていった。
やがて、テレビに呼ばれることが当たり前になった。

けれど、人気の頂点で亀田の筆は止まった。
ネタをつくりだそうと、何度も書いては消し、書いては消した。
何を書いても、観客の笑い声が想像できない。
一方、岩塚は、そのかわいい見た目と鋭いツッコミというギャップが受け、ピンの仕事が増えていった。

亀田はネタが書けないことと岩塚の人気に苦しんだ。
スポットライトの真ん中には、いつもカナがいた。
そのネタを書いたのは俺だ。
亀田は、そう思わずにはいられなかった。

そんなある夜、亀田の電話が鳴った。
父が倒れた、戻ってこい、という知らせだった。

電話を切ったあと、亀田は少しだけ、ほっとしていた。

もう、ネタを書けない苦しみを味わわなくていい。
自分の書いたネタで、カナばかりが笑いを取るのを見なくていい。

笑いをつくりだせない自分に、もう舞台に立つ資格はない。
亀田は、そう自分に言い聞かせた。

カナに話せば、きっと「待ってる」と言われる。
そうしたら、また苦しみの毎日が始まる。

亀田は岩塚に何も言わず、地元長岡へ帰った。

落ち着いたら連絡しよう。
そう思っているうちに、父の看病と会社のことに追われ、時間が過ぎていった。
テレビをつければ、カナがひとりで笑いを取っていた。
電話が鳴るたびに、画面の名前を見つめるだけで、出ることができなかった。

一方、亀田と連絡が取れなくなった岩塚は何度も電話をかけた。
留守番電話に何度も声を残した。
電話がつながることも、折り返しが来ることも、一度もなかった。

それでも岩塚は、自分がテレビに出ていれば、自分を見た亀田がいつか戻ってくると信じた。
だから、KOSHIJI岩塚と名乗り続けた。

返事のないまま、季節がいくつも過ぎた。
しびれを切らした岩塚は、亀田を連れ戻そうと一度だけ長岡へ向かった。

その日も、雪が降っていた。
建設会社の前で、亀田は作業着の男たちに指示を出していた。
亀田の顔は、もう芸人のそれではなかった。
その隣には、小さな子どもの手を引く奥さんがいた。
岩塚に気づいた亀田は、目を合わせようともせず、短い言葉で岩塚を追い返した。

あの人は、もう帰ってこない。

その日から、岩塚はKOSHIJIの名前を口にしなくなった。`},

SH2:{t:"真相2　ネタ帳", x:`亀田は家業を継いだ。
結婚して、子どもが生まれて、町で一番の会社の社長になった。

実際は、逃げ帰った負い目から、亀田は仕事に打ち込んだ。
もうこれしかないと自分を追い込んだ。
仕事はもちろん、どんなに理不尽なことでも自分が頭を下げれば済むなら何度も下げた。
会社や従業員、そして家族のため、恨まれることもした。
亀田の苦労は実り、会社の規模は拡大し、跡継ぎとして周りも認めた。

しかし、満たされることはなかった。
劇場で観客の笑い声に包まれるあの感覚を超えるものなどなかった。

亀田はKOSHIJIのことを忘れたことはなかった。
思い出す度に罪悪感に襲われていた。

一度だけ、カナが会社の前に現れたことがあった。
雪の中に立つカナは、テレビで見るよりも、一緒にコンビを組んでいた頃よりも、ずっと小さく見えた。
今さら、どんな顔をして、何を言えばいい？
カナと向き合うことは、逃げ出した自分に向き合うことだ。
亀田は目を合わせることもできず、言葉にならない言葉を発するだけで精一杯だった。
肩を落として、その場を後にするカナを見送ることしか出来なかった。

それでもテレビに映るカナをずっと追いかけていた。
カナをTVで見る回数が減っていることも、ネタがなくて飽きられていることも、全部知っていた。

カナには、ネタを書く相方がいない。
カナの良さを理解し、カナの良さを活かせる相方がいない。
それを一番分かっていたのは亀田だった。

俺ならカナの良さを引き出せる。
五年ぶりに筆が動いた。
思い浮かぶネタはカナを当て書きにしたネタだった。

亀田は大喜利大会を立ち上げた。
かつて所属していた事務所への連絡は、越後に任せた。
カナと一緒にKOSHIJIとして所属した事務所だ。
黙って逃げ出した自分が、今さら名乗り出るわけにはいかない。
なんて小さな人間なんだと自分でも恥じた。
越後を通して、司会にカナを指名した。
大会のトリでカナを舞台に呼び、KOSHIJIの鉄板ネタをもう一度やる。
そのあと新しい台本を差し出して頭を下げる。
もう一度一緒にやってくれないか、と。

社長業をこなしながら、準備を進めた。
毎晩遅くまで、何度も新ネタを書き直した。
しかし、まったく苦にならなかった。
当日の朝は、誰よりも早く会場に来た。
嬉しくて楽しみで眠れず、家で時間を待つこともできなかった。

岩塚が「最後の仕事になるかも」と聞かされていた仕事は、亀田が何年もかけて用意した、始まりの舞台になるはずだった。`},

SH3:{t:"真相3　すれ違い漫才", x:`大喜利大会当日の朝、岩塚が会場に着くと、中から男女の掛け合いの声が聞こえてきた。

これ、KOSHIJIの鉄板ネタ…
ボケの声は飽きるほど聞いた相方だった亀田。
けれど、ツッコミは自分ではない、知らない女の声だった。
岩塚は自分の体温が急激に下がったことを感じた。

亀田に声をかける気持ちになれず、岩塚は何とか会場から出ると、近くのコンビニに向かうことにした。
その頃、舞台では亀田が額に汗を浮かべ、練習を続けていた。

>>＊

亀田「これぐらいにしておくか。悪いな、越後。最近ずっと付き合わせて。」

四年ぶりの舞台だ。
カナの前で、死んでも噛むわけにはいかない。
あいつのことだ。
トリで呼んで、新しい台本を見せれば、二つ返事で乗ってくる。

>>＊

コンビニで温かいお茶を買った岩塚は、少しでも体温をもとに戻そうと両手でお茶を握りしめて公民館に戻った。
楽屋で待つように聞いているが、楽屋にはどうやって行けばいいのだろうか？
廊下を歩いていると、楽屋らしき部屋の前に女性が立っていた。

岩塚「すみません、今日、司会を務めます岩塚です。」
越後「あ、越後です。今日のイベントの回答者です。」

岩塚はその声を聞き、朝の声と越後の声が重なった。

岩塚「あなた、もしかして朝、漫才してなかった？」
越後「…あ、はい、…えっと、亀田社長にネタを見てもらってました、はい」

ああ、そうか。
KOSHIJIは、もう私のじゃないんだ。
岩塚は全身から力が抜けていく感覚に襲われた。
それでも岩塚は必死に立て直そうとした。
KOSHIJIはもう終わったじゃないか。
私は今日の仕事をやりきらないと次がない…。

岩塚は越後に軽く頭を下げ、一人で楽屋に入った。
楽屋には汗を浮かべた亀田がいた。

>>＊

岩塚と楽屋で二人きりになった亀田。
大学の部室に戻ったかのように亀田の心は弾む。

しかし、眼の前のカナはあの頃の姿ではない。
テレビで見るより、ずっと疲れた顔をしていた。
仕事が減っているのも、苦しいのも、全部知っている。
だから、俺が呼んだんだ。
よく来てくれた。
また一緒にやろう。
大丈夫、俺達ならすぐに賞レースで優勝だ。
そして冠番組も始まる、休みなんて取れない毎日になるぞ。

このあとに控えているサプライズを考え亀田は言った。
「よお、久しぶりだな。TVで見てるよ。相変わらず、俺がいないと何もできないんだな。…しょうがない、また面倒見てやるよ」

>>＊

岩塚は眼の前が真っ暗になった。
その場にくずれそうになったが、なんとか踏みとどまった。
岩塚「…そう」
短く返すのが精一杯だった。
ずっと一人でやってきたじゃないか。苦しいときも一人で乗り越えてきた。
亀田の助けなどなくても大丈夫、私ならやれる。
岩塚は必死に自分に言い聞かせ、なんとか笑顔をつくった。

>>＊

大喜利の前半戦、岩塚は余計な考えを捨て、司会に集中した。
自分の武器はツッコミだ、きっとうまく行く。
場を盛り上げようとするも、水を差したのはかつての相方の亀田の野次だった。

本番中、岩塚は様々な感情が湧き上がったが必死に冷静であろうと努め、前半を終えた。
休憩となり、楽屋に向かう亀田を見て、せめて釘を刺そうと思い、亀田の後を追った。

>>＊

休憩中の楽屋で、岩塚は感情を押し殺しながら亀田に言った。
岩塚「ツッコミは私がやるから、ただ見ていてほしい」
すると、亀田はカードを差し出した。
「お前こそ黙って見てろ。トリはKOSHIJIだ。ネタはこれだ」

KOSHIJIは私たちコンビの名前だった…。
新しい相方とのKOSHIJIを、客席から見ていろ…？
あんまりな仕打ちだ。
一人になってから、どれだけ苦労したのか分かっているのか…？！

何とか踏みとどまっていた岩塚の足もとが、その言葉で崩れ落ちた。

>>＊

トリで呼ぶまで、黙って見てろ。
このネタは、お前のツッコミがないと始まらないんだ。

亀田は、最後まで伝えたい言葉が足りなかった。
岩塚は、最後までその言葉を受け取れなかった。`},

SH4:{t:"真相4　{幕間|まくあい}", x:`岩塚は、楽屋の中にいられなかった。
ふらふらになりながら廊下に出た。

ダメだ、頭を冷やそう。冷静になるんだ。
岩塚は窓の外に目をやる。
外は吹雪で風が強そうだ。

とにかく一秒でも早く、外の空気を吸いたい。
岩塚は、廊下の窓を開けた。
その瞬間、吹きつけていた強い風が、一気に廊下へ流れ込んできた。
その拍子に、目の前の一際大きなつららが根元から折れた。
落ちていくつららは風を受け、窓枠に叩きつけられて砕けた。
大きなかけらがいくつも、雪と一緒に廊下の床に転がった。
ごうっという風の音が、すべてをかき消した。

床に散らばったつららを、岩塚はぼんやりと見下ろした。
いけない、舞台の邪魔になる。
片付けないと。
気がつくと、両手でつららをかき集めていた。
冷たさは、何も感じなかった。
手は、ポケットの中のタイツを探り当てていた。
朝、コーヒーで汚れたタイツだった。
岩塚は、つららのかけらをタイツに詰めていった。
タイツの端を握ると、先がずしりと垂れ下がった。
その重さだけが、妙にはっきりしていた。
まるで、何かに背中を押されているようだった。
足が、勝手に楽屋へ向かっていた。
亀田はドアに背を向けたまま、目を閉じて、口の中でネタを繰り返していた。
岩塚が戻ったことにも、気づいていないようだった。
岩塚は、一言も発しなかった。
ただ、タイツを大きく振りかぶり、振り下ろした。

両手に伝わった衝撃で、岩塚は我に返った。
亀田は、長机に突っ伏したまま動かなかった。
まるで、寝ているようだった。
岩塚には、亀田がもう死んでしまったとしか思えなかった。
悲鳴が、喉の奥からせり上がってきた。
声になる寸前、岩塚は握っていたタイツの端を口に押し付けた。

ダメだ、誰かに知られたら、大会が中止になる。
芸人は舞台に立ったら幕が下りるまで舞台から降りてはいけない。
亀田の口癖だった。
岩塚の頭にあったのは、それだけだった。

岩塚は、タイツから氷のかけらを振り出し、楽屋の窓から雪の中へ捨てた。
開けた窓から、吹雪が吹き込んできた。
窓を閉めることすら気が回らない。

濡れたタイツも、捨てなければいけなかった。
けれど、デビューからずっと、この赤いタイツと一緒に舞台に立ってきた。
いけない、赤いタイツがなければ舞台に立てない、赤いタイツは捨てられない。
岩塚は、濡れたタイツと亀田に渡されたカードを上着のポケットに押し込んだ。

>>＊

廊下の角に、初出場の回答者がひとりで壁にもたれていた。
岩塚は、平静を取り戻そうと話しかけた。
岩塚「大喜利初なんだって？さっきの回答、面白かった！」
続けて、お客さんが三人しかいなかった、あの初舞台の話をした。
誰かと話していないと、立っていられなかった。

話している間に、三幸が楽屋の方へ歩いていった。
しばらくして、越後も通っていった。

岩塚は、ただぼんやりとその背中を見送った。
不思議と、怖さはなかった。
楽屋の方からは、何の声も聞こえてこなかった。

>>＊

亀田は、まだかすかに息をしていた。
もう痛みも何も感じなかった。
体も指一本動かせなかった。
もう助からないことは、自分でも分かった。

…悪かったな、カナ。
これから俺達KOSHIJIのお笑い人生がもう一度始まるはずだったんだけどな。

まぶたの裏で、亀田は新ネタの台本をめくった。
カナのツッコミが聞こえる。
最後の一行で、カナが笑った気がした。

>>＊

休憩の終わり、楽屋の方から越後の悲鳴が聞こえた。

ポケットの中で、タイツは冷たく湿っていた。
カードも、少しずつ湿っていった。
カードには、亀田の字で、二人の鉄板ネタが書かれていた。

お守りだった赤いタイツも、二人の鉄板ネタも、岩塚には捨てることができなかった。`}
};

/* ===== 真相の一覧 ===== */
const SHINSO_LEAD = "";   /* 一覧の頭の一言（空なら出さない。ここで変える） */
const SHINSO = ["SH1","SH2","SH3","SH4"];

/* ===== 公開用の設定（ここだけ書き換える） ===== */
const NOTE_URL = "";   /* Finの画面に出すnote記事のURL（空なら出さない） */
const GA_ID = "G-NRY8TNWV07";      /* Googleアナリティクスの測定ID（例：G-XXXXXXXXXX。空なら計測しない） */
/* ========================================== */

/* アクセス解析（GA4）。GA_IDが空なら何もしない */
if (GA_ID){
  const sc = document.createElement("script");
  sc.async = true; sc.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(sc);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ window.dataLayer.push(arguments); };
  window.gtag("js", new Date()); window.gtag("config", GA_ID);
}
function track(name, params){ try { if (GA_ID && window.gtag) window.gtag("event", name, params || {}); } catch(e){} }

const HUB = [
  {h:"思い出す", items:[["M1","大喜利大会と関係者"],["M2","朝の楽屋"],["M3","大喜利前半戦の舞台"],["M4","休憩前"],["M5","休憩中"]]},
  {h:"現場を見る", items:[["G1","被害者と室内"],["G2","楽屋の窓の外"],["G4","楽屋の床"],["G3","廊下の窓"],["G5","評価用紙"]]},
  {h:"話を聞く", people:[
    {n:"岩塚（タレント）", items:[["I1","休憩中"],["I2","亀田"],["I5","今朝のこと"],["I3","赤いタイツ"],["I4","KOSHIJI"]]},
    {n:"越後（亀田の部下）", items:[["Y1","休憩中"],["Y2","亀田"],["Y4","今朝のこと"],["Y3","スマホ"],["Y5","預かったカード"],["Y6","KOSHIJI"]]},
    {n:"{三幸|さんこう}（亀田の取引先）", items:[["S1","休憩中"],["S5","亀田"],["S2","今朝のこと"],["S4","タバコの灰"],["S3","KOSHIJI"]]}
  ]}
];

const SPEAKERS = ["私","亀田","岩塚","越後","三幸"];
const NEW_LABEL = "新";   /* 新しく増えた選択肢に付く目印（言葉はここで変える） */
const CONDITIONAL = ["I3","I4","I5","S2","S3","S4","Y3","Y4","Y5","Y6"];
let S = {seen:new Set(), hubSeen:false, suspect:null};
const v = id => S.seen.has(id);
const all = (...a) => a.every(v);

function shown(id){
  switch(id){
    case "I3": return v("M2");
    case "S2": return v("S5");
    case "I5": return v("S2");
    case "I4": return v("G5") || v("Y5");
    case "S3": return v("G5") || v("Y2");
    case "S4": return all("S1","G3");
    case "Y3": return all("Y1","M5");
    case "Y4": return all("S2","Y6");
    case "Y5": return all("I1","Y6");
    case "Y6": return v("G5") || v("Y2");
    default: return true;
  }
}

function ruby(s, strip){
  return s.replace(/\{([^|}]+)\|([^}]+)\}/g, strip ? "$1" : "<ruby>$1<rt>$2</rt></ruby>");
}

function render(text, strip){
  const re = new RegExp("^(" + SPEAKERS.join("|") + "|\\{(?:" + SPEAKERS.join("|") + ")\\|[^}]+\\})(「.*)$");
  let html = "", prev = null, brk = false;
  for (const raw of text.split("\n")){
    if (raw.trim() === ""){ brk = prev !== null; continue; }
    let type, body;
    const m = raw.match(re);
    if (raw.startsWith("@@")){ const [n,d]=raw.slice(2).split("::"); type="rel"; body=`<div class="rel"><span>◯ ${ruby(n,strip)}</span><span>${ruby(d,strip)}</span></div>`; }
    else if (raw.startsWith(">>")){ type="ctr"; body=`<p class="ctr">${ruby(raw.slice(2),strip)}</p>`; }
    else if (m){ type="dlg"; body=`<div class="ln"><span>${ruby(m[1],strip)}</span><span class="sp">${ruby(m[2],strip)}</span></div>`; }
    else { type="nar"; body=`<p>${ruby(raw,strip)}</p>`; }
    let cls = "";
    if (brk) cls = "brk";
    else if (prev && prev !== type && (prev === "dlg" || type === "dlg")) cls = "sw";
    html += `<div class="${cls}">${body}</div>`;
    prev = type; brk = false;
  }
  return html;
}

const app = document.getElementById("app");
function page(inner){ app.innerHTML = `<div class="card">${inner}</div>`; window.scrollTo(0,0); }
function btn(label, fn, cls=""){ const id="b"+Math.random().toString(36).slice(2); btnFns[id]=fn; return `<button class="${cls}" data-id="${id}">${label}</button>`; }
let btnFns = {};
app.addEventListener("click", e => { const b = e.target.closest("button"); if (b && btnFns[b.dataset.id]) btnFns[b.dataset.id](); });

function title(){
  btnFns = {};
  page(`<h1>大喜利殺人事件</h1>
  <p class="title-k">- Kの悲劇 -</p>
  <p class="title-sub">作・ミタ<br>プログラム・Claude</p>
  <div class="choices">
    ${btn("はじめから", start, "main")}
  </div>
  <div class="warn"><p>・プレイ時間は30分前後です。</p><p>・作中で人が亡くなる場面があります。</p><p>・この物語はフィクションです。実在の人物・団体・企業とは関係ありません。</p>${GA_ID ? "<p>・アクセス解析のため、Googleアナリティクスを使用しています。</p>" : ""}</div>`);
}

function start(){
  track("game_start");
  S = {seen:new Set(), hubSeen:false, suspect:null};
  btnFns = {};
  page(render(BLOCKS.OP.x, false) + `<div class="choices">${btn("次へ", hub, "main")}</div>`);
}

function hub(){
  btnFns = {};
  const strip = S.hubSeen;
  let h = `<p>警察の到着までに何ができるだろう。</p>
  <p class="note brk">※行動や質問などの回数に特に制限はありません。<br>※行動や質問などにより新しい選択肢が加わる場合があります。</p>`;
  for (const g of HUB){
    h += `<h3>${g.h}</h3>`;
    if (g.items){
      h += `<div class="group">` + g.items.map(([id,l]) => btn(l, ()=>block(id), v(id)?"read":"")).join("") + `</div>`;
    } else {
      for (const p of g.people){
        const its = p.items.filter(([id])=>shown(id));
        h += `<p class="person">${ruby(p.n, strip)}</p><div class="group">` + its.map(([id,l]) => btn(l + (CONDITIONAL.includes(id) && !v(id) ? `<span class="new">${NEW_LABEL}</span>` : ""), ()=>block(id), v(id)?"read":"")).join("") + `</div>`;
      }
    }
  }
  h += `<div class="group brk">${btn("犯人を指名する", accuse, "main")}</div>`;
  S.hubSeen = true;
  page(h);
}

function block(id){
  btnFns = {};
  const b = BLOCKS[id];
  const strip = v(id);
  S.seen.add(id);
  track("view_block", {block_id:id, block_title:b.t, seen_count:S.seen.size});
  page(`<h2>${b.t}</h2>` + render(b.x, strip) + `<div class="choices">${btn("戻る", hub, "mid")}</div>`);
}

function accuse(){
  btnFns = {};
  page(`<p>亀田さんの命を奪ったのは、誰だろう。</p><div class="choices">
    ${btn("岩塚", ()=>pick("岩塚"), "mid")}
    ${btn("越後", ()=>pick("越後"), "mid")}
    ${btn("三幸", ()=>pick("三幸"), "mid")}
    ${btn("私", pickMe, "mid")}
  </div>`);
}

function talked(){ return [...S.seen].some(id => /^(S\d|Y|I)/.test(id)); }

function pickMe(){
  btnFns = {};
  track("accuse", {suspect:"私"});
  if (!talked()){ track("ending", {ending_type:"自首"}); return ending(render(BLOCKS.JISHU.x, true), true); }
  page(render(BLOCKS.ME.x, true) + `<div class="choices">${btn("指名に戻る", accuse, "mid")}</div>`);
}

function pick(who){
  S.suspect = who;
  track("accuse", {suspect:who});
  btnFns = {};
  const opts = [];
  if (all("Y5","G2","G3","G5","M2","M5")) opts.push(["預かったカード","card"]);
  if (v("G1")) opts.push(["重いガラスの灰皿","ash"]);
  if (v("G3")) opts.push(["廊下の窓のタバコの灰","tobacco"]);
  if (v("G3")) opts.push(["消えたつらら","ice"]);
  let h = opts.length ? `<p>決め手になるのは…</p>` : `<p>まだ、決め手になるものがない。</p>`;
  h += `<div class="choices">` + opts.map(([l,k])=>btn(l, ()=>resolve(k), "mid")).join("") + btn("もう一度調べる", hub, "mid") + `</div>`;
  page(h);
}

function resolve(k){
  btnFns = {};
  const w = S.suspect;
  const ev = {card:"預かったカード", ash:"灰皿", tobacco:"タバコの灰", ice:"つらら"}[k];
  track("evidence", {suspect:w, evidence:ev});
  if (w === "越後"){ track("ending", {ending_type:"越後を指名"}); return ending(render(BLOCKS.E_KURI.x, true), true); }
  if (w === "三幸"){ track("ending", {ending_type:"三幸を指名"}); return ending(render(BLOCKS.E_SANKO.x, true), true); }
  if (k === "card"){ track("ending", {ending_type:"トゥルー"}); return trueEnd(1); }
  track("ending", {ending_type:"言い逃れ（" + ev + "）"});
  const head = {ash:"E_NIGE_ASH", tobacco:"E_NIGE_TOBACCO", ice:"E_NIGE_ICE"}[k];
  ending(render(BLOCKS[head].x + "\n\n" + BLOCKS.E_NIGE_COMMON.x, true), true);
}

function trueEnd(n){
  btnFns = {};
  const t = BLOCKS["T"+n].x;
  if (n < 3) page(render(t, true) + `<div class="choices">${btn("次へ", ()=>trueEnd(n+1), "main")}</div>`);
  else shinsoList(render(t, true));
}

/* 真相の一覧：T3の最後に並ぶ。真相ページから戻ったときは一覧だけ */
function shinsoList(head){
  btnFns = {};
  const strip = S.listSeen;
  let h = head ? head + `<div class="brk"></div>` : "";
  if (SHINSO_LEAD) h += `<p class="ctr">${SHINSO_LEAD}</p>`;
  h += `<div class="group slist brk">`
     + SHINSO.map(id => btn(ruby(BLOCKS[id].t, strip), ()=>shinso(id), v(id)?"read":"")).join("")
     + `</div>`
     + (SHINSO.every(v) ? `<div class="fin"><p class="fin-word">Fin</p><p>最後までお付き合いいただき、ありがとうございました。</p>`
        + (NOTE_URL ? `<p class="note brk">バグや感想があれば、こちらまで<br><a href="${NOTE_URL}" target="_blank" rel="noopener">${NOTE_URL}</a></p>` : "")
        + `</div>` : "")
     + `<div class="choices">${btn("タイトルに戻る", title, "main")}</div>`;
  S.listSeen = true;
  if (SHINSO.every(v) && !S.finSent){ S.finSent = true; track("complete_all"); }
  page(h);
}

function shinso(id){
  btnFns = {};
  const strip = v(id);
  S.seen.add(id);
  track("view_shinso", {shinso_id:id, seen_count:SHINSO.filter(v).length});
  page(`<h2>${ruby(BLOCKS[id].t, strip)}</h2>` + render(BLOCKS[id].x, true)
    + `<div class="choices">${btn("真相の一覧に戻る", ()=>shinsoList(), "mid")}</div>`);
}

function ending(html, retry){
  btnFns = {};
  page(html + `<div class="choices">${retry ? btn("犯人の指名前に戻る", hub, "main") : ""}${btn("タイトルに戻る", title, retry ? "mid" : "main")}</div>`);
}

title();
